<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DataViews Playground</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
                height: 100vh;
                overflow: hidden;
            }

            .container {
                display: flex;
                height: 100vh;
            }

            .editor-preview-area {
                flex: 2;
                background-color: #f5f5f5;
                border-right: 1px solid #ddd;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #999;
                font-size: 18px;
            }

            .chat-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                background-color: #ffffff;
            }

            .chat-header {
                padding: 20px;
                border-bottom: 1px solid #e0e0e0;
                background-color: #fafafa;
            }

            .chat-header h1 {
                font-size: 20px;
                font-weight: 600;
                color: #333;
            }

            .messages-container {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .message {
                max-width: 80%;
                padding: 12px 16px;
                border-radius: 12px;
                line-height: 1.5;
                font-size: 14px;
            }

            .message.assistant {
                align-self: flex-start;
                background-color: #f0f0f0;
                color: #333;
            }

            .message.user {
                align-self: flex-end;
                background-color: #007aff;
                color: #ffffff;
            }

            .input-area {
                padding: 20px;
                border-top: 1px solid #e0e0e0;
                background-color: #fafafa;
            }

            .input-container {
                display: flex;
                gap: 12px;
            }

            .input-container input {
                flex: 1;
                padding: 12px 16px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                font-family: inherit;
            }

            .input-container input:focus {
                outline: none;
                border-color: #007aff;
            }

            .input-container button {
                padding: 12px 24px;
                background-color: #007aff;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .input-container button:hover {
                background-color: #0056b3;
            }

            .input-container button:active {
                background-color: #004494;
            }
        </style>
        <script src="client.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class="editor-preview-area">
                <p>Editor / Preview Area (Coming Soon)</p>
            </div>

            <div class="chat-area">
                <div class="chat-header">
                    <h1>DataViews Assistant</h1>
                </div>

                <div class="messages-container">
                    <div class="message assistant">
                        Hello! I'm here to help you learn and experiment with
                        the @wordpress/dataviews package. Feel free to ask me
                        questions or request code examples.
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-container">
                        <input
                            type="text"
                            placeholder="Ask a question or request code..."
                        />
                        <button>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
